name: run-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.1, 8.2, 8.3]
        laravel: ['8.*', '9.*', '10.*', '11.*', '12.*']
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            php: 8.3
            os: ubuntu-latest
            testbench: 11.*
          - laravel: 13.*
            php: 8.3
            os: windows-latest
            testbench: 11.*
          - laravel: 13.*
            php: 8.4
            os: ubuntu-latest
            testbench: 11.*
          - laravel: 13.*
            php: 8.4
            os: windows-latest
            testbench: 11.*
          - laravel: 13.*
            php: 8.5
            os: ubuntu-latest
            testbench: 11.*
          - laravel: 13.*
            php: 8.5
            os: windows-latest
            testbench: 11.*
        exclude:
          - laravel: 11.*
            php: 8.1
          - laravel: 12.*
            php: 8.1

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Ensure composer.lock exists
        shell: bash
        run: |
          if [ ! -f composer.lock ]; then
            composer update --no-interaction --prefer-dist
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [ -z "${{ matrix.testbench }}" ]; then
            composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-update
            composer update laravel/framework -W --${{ matrix.stability }} --prefer-dist --no-interaction
          else
            composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
            composer update laravel/framework orchestra/testbench -W --${{ matrix.stability }} --prefer-dist --no-interaction
          fi

      - name: Execute tests
        run: vendor/bin/pest
